# Override of the bundled pipeline of the same name — generated by the vibecrew
# plugin (sombrax_plugins) from the app's DefaultPipelines by
# scripts/generate_pipeline_overrides.py. Do not hand-edit; regenerate.

name = "Planned"
description = "Spec → plan → plan review, each step on the agent and model you pick; the main agent writes the code itself."

# The middle tier: the planning ceremony is delegated and per-step bindable,
# but the implementation stays in the main loop — there is no `code` stage, so
# the agent that runs the card writes the code itself.
#
# Family-neutral like Async: no `agent =`, no `[models]`. Every step runs on the
# card's main agent unless the operator binds it; the two review steps default
# to Codex.

[agents]
plan-review = "CODEX"
code-review = "CODEX"

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "spec"
label = "Spec via {{agent_name}} · {{model_name}}"
default_enabled = true
subagent = "product"
prompt = "FIRST, check the card description: if it already contains the full spec — meaning `### Outcome`, `### Scope`, and `### Testing & acceptance criteria` EACH occur at the START of a line (prefix match, so `### Outcome — what's different when this is done` counts), and NOT inside a fenced code block or a block quote; ALL THREE are required and if any one is missing take the OTHERWISE path — then do NOT delegate. Instead write `SPEC.md` at the workspace root as exactly: the line `## Task: <the card's title, verbatim>`, then a blank line, then the card description verbatim (the description does NOT carry the title — it begins at the `**In one sentence:**` line — so reconstruct that first line from the card's title field). Strip the `## Pipeline` block from the body, anchored to STANDALONE marker lines: take the LAST line whose entire content is exactly `<!-- vk:pipeline:start -->`, and the first line after it whose entire content is exactly `<!-- vk:pipeline:end -->`, and delete everything between them including both marker lines. A marker mentioned inside a prose line is not a delimiter — leave that line alone, since a spec may legitimately quote the markers while describing them. Then collapse the blank run the strip leaves behind so the file ends with a single trailing newline. Also sweep out any stray executor-pin bullet (a line matching `- Run this card with the ... execution agent: pass ...`) left outside the block — it normally sits inside the block and goes with it, so this is just a safety net. Do not edit, re-author, or re-verify the copied text: adopt the card's decisions as settled. Then report that the spec was adopted from the card description and move on to the next stage. (The card description is already in your task context; if you were given only the card title or id, fetch the card to read it.) OTHERWISE, run the full spec stage: Do NOT write the spec yourself. {{DELEGATE}} to write the technical spec for this card to `SPEC.md` at the workspace root — pass the workspace-root path plus the card description in the delegate's prompt. When it returns, verify `SPEC.md` exists and covers the card's outcome, scope, and acceptance criteria; if it is missing or thin, re-delegate with the concrete gaps rather than writing the spec in the main loop. `SPEC.md` is pipeline paperwork, not a deliverable: never commit it — add it to the repo's exclude file (append the name to the file at `git rev-parse --git-path info/exclude`) right after it is written."

[[stage]]
id = "plan"
label = "Plan via {{agent_name}} · {{model_name}}"
default_enabled = true
subagent = "planner"
prompt = "Do NOT write the plan yourself. {{DELEGATE}} to turn `SPEC.md` into a step-by-step `IMPLEMENTATION_PLAN.md` at the workspace root — pass the workspace-root path plus the card description in the delegate's prompt. When it returns, verify the plan's steps are grounded in real repo files; if not, re-delegate with the concrete gaps rather than writing the plan in the main loop. When the plan is verified, measure it and report the single line `PLAN-FACTS: <size> KB, <n> steps, <n> files, <n> open decisions` — the byte size of `IMPLEMENTATION_PLAN.md`, its numbered steps, the distinct files its steps name, and the open items in its Risks / open questions section; the next two stages read this line. `IMPLEMENTATION_PLAN.md` is pipeline paperwork, not a deliverable: never commit it — add it to the repo's exclude file (append the name to the file at `git rev-parse --git-path info/exclude`) right after it is written."

[[stage]]
id = "plan-review"
label = "Plan review via {{agent_name}} · {{model_name}}"
default_enabled = true
subagent = "reviewer"
prompt = "GATE FIRST — read the plan stage's PLAN-FACTS line (measure `IMPLEMENTATION_PLAN.md` yourself if it is missing): if the plan is under 40 KB AND has 0 open decisions AND the card's **Routing:** line (when it carries one) does not force the review with plan-review: yes, SKIP this stage — report the single line `PLAN-GATE: plan-review skipped (<size> KB, <n> open decisions)` and move on; a small, closed plan does not repay an independent review, which routinely costs more than the plan itself. Otherwise report `PLAN-GATE: plan-review running (<size> KB, <n> open decisions)` and proceed: Do NOT review the plan yourself. {{DELEGATE}} to independently review `IMPLEMENTATION_PLAN.md` read-only against `SPEC.md` and the repo, reporting findings grouped by severity. Iterate until the reviewer reports no significant findings, capped at TWO review passes — findings still open after the second pass mean the plan (or the spec above it) is mis-scoped: revise the plan (re-run the planning stage) or escalate; never pay a third pass. Resolve confirmed findings by revising the plan (re-run the planning stage, or edit `IMPLEMENTATION_PLAN.md` directly) before proceeding to the coding stage. This is a read-only plan review: do not modify code here."

[[stage]]
id = "wait-for-approval"
label = "Wait for approval"
default_enabled = false
prompt = "Pause for operator approval at this point: commit the work so far, then stop and wait for the operator's decision or instructions before continuing to later stages — do not advance on your own until the operator responds."

[[stage]]
id = "code-review"
label = "Code review via {{agent_name}} · {{model_name}}"
default_enabled = false
subagent = "reviewer"
prompt = "After implementing, {{DELEGATE}} to run an independent read-only review of the card's diff against the base branch, iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready. After the review, leave a one-line comment on the card summarizing the findings status (`vibecrew_api.py comment $VIBECREW_CARD_ID --body \"code review: …\"`)."

[[stage]]
id = "update-docs"
label = "Update documentation"
default_enabled = false
prompt = "Update the documentation affected by this change so the docs match what shipped, and commit it before marking the card ready."

[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = true
prompt = "When the work is implemented and reviewed, squash-merge this card's branch into the base branch yourself — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job. Run the artifact gate before merging: the squash diff must not add or modify pipeline paperwork — `SPEC.md`, `IMPLEMENTATION_PLAN.md`, `PRIOR_KNOWLEDGE.md` — unless the card's task is explicitly about those files; if it does, remove them from the branch (restore the base version or delete, and commit) before merging. Never leave pipeline artifacts on the base branch. After a successful direct merge, record it durably — call `vibecrew_api.py merge-record $VIBECREW_WORKSPACE_ID --sha <sha>` (idempotent; pass `--repo-id` on a multi-repo workspace) — and end your final message with a `SHIPPING-REPORT:` block — `delivered: merge` and `merge_commit: <sha>` — plus the applicable optional lines `commits: <n>`, `tests: <pass|fail|not-run>`, `docs: <updated|none-needed|skipped>`, `remaining: <one line>`, `deviations: <one line>`."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch. After the PR is opened, record it durably — call `vibecrew_api.py pr-record $VIBECREW_WORKSPACE_ID --number <n> --url <u>` — and end your final message with a `SHIPPING-REPORT:` block — `delivered: pr` and `pr: <url>` — plus the applicable optional lines `commits: <n>`, `tests: <pass|fail|not-run>`, `docs: <updated|none-needed|skipped>`, `remaining: <one line>`, `deviations: <one line>`."
