# Override of the bundled pipeline of the same name — generated by the vibecrew
# plugin (sombrax_plugins) from the app's DefaultPipelines by
# scripts/generate_pipeline_overrides.py. Do not hand-edit; regenerate.

name = "Basic"
description = "Classic dev flow: spec → plan → implement → review → squash-merge."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "spec"
label = "Create spec"
default_enabled = false
prompt = "Write a technical spec for this card and save it to `SPEC.md` at the repo root before implementing. `SPEC.md` is pipeline paperwork, not a deliverable: never commit it — add it to the repo's exclude file (append the name to the file at `git rev-parse --git-path info/exclude`) right after it is written."

[[stage]]
id = "plan"
label = "Create plan"
default_enabled = false
prompt = "Write a step-by-step implementation plan and save it to `IMPLEMENTATION_PLAN.md` at the repo root. When it is written, measure it and report the single line `PLAN-FACTS: <size> KB, <n> steps, <n> files, <n> open decisions`. `IMPLEMENTATION_PLAN.md` is pipeline paperwork, not a deliverable: never commit it — add it to the same exclude file as `SPEC.md`."

[[stage]]
id = "plan-review"
label = "Review plan"
default_enabled = false
prompt = "GATE FIRST — read the PLAN-FACTS line (measure `IMPLEMENTATION_PLAN.md` yourself if it is missing): if the plan is under 40 KB AND has 0 open decisions AND no **Routing:** line forces the review with plan-review: yes, SKIP this stage with the single line `PLAN-GATE: plan-review skipped (<size> KB, <n> open decisions)`. Otherwise have the implementation plan reviewed (e.g. a codex plan review, read-only), capped at two passes, and resolve blockers before writing code."

[[stage]]
id = "wait-for-approval"
label = "Wait for approval"
default_enabled = false
prompt = "Pause for operator approval at this point: commit the work so far, then stop and wait for the operator's decision or instructions before continuing to later stages — do not advance on your own until the operator responds."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = false
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready. After the review, leave a one-line comment on the card summarizing the findings status (`vibecrew_api.py comment $VIBECREW_CARD_ID --body \"code review: …\"`)."

[[stage]]
id = "update-docs"
label = "Update documentation"
default_enabled = false
prompt = "Update the documentation affected by this change so the docs match what shipped, and commit it before marking the card ready."

[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = true
prompt = "When the work is implemented and reviewed, squash-merge this card's branch into the base branch yourself — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job. Run the artifact gate before merging: the squash diff must not add or modify pipeline paperwork — `SPEC.md`, `IMPLEMENTATION_PLAN.md`, `PRIOR_KNOWLEDGE.md` — unless the card's task is explicitly about those files; if it does, remove them from the branch (restore the base version or delete, and commit) before merging. Never leave pipeline artifacts on the base branch. After a successful direct merge, record it durably — call `vibecrew_api.py merge-record $VIBECREW_WORKSPACE_ID --sha <sha>` (idempotent; pass `--repo-id` on a multi-repo workspace) — and end your final message with a `SHIPPING-REPORT:` block — `delivered: merge` and `merge_commit: <sha>` — plus the applicable optional lines `commits: <n>`, `tests: <pass|fail|not-run>`, `docs: <updated|none-needed|skipped>`, `remaining: <one line>`, `deviations: <one line>`."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch. After the PR is opened, record it durably — call `vibecrew_api.py pr-record $VIBECREW_WORKSPACE_ID --number <n> --url <u>` — and end your final message with a `SHIPPING-REPORT:` block — `delivered: pr` and `pr: <url>` — plus the applicable optional lines `commits: <n>`, `tests: <pass|fail|not-run>`, `docs: <updated|none-needed|skipped>`, `remaining: <one line>`, `deviations: <one line>`."
